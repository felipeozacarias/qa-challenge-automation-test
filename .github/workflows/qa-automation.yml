name: QA Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cypress-tests:
    name: Cypress Web + API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run Cypress suite with quality gate
        run: npm run ci

      - name: Upload Cypress evidence and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: |
            cypress/videos/**
            cypress/screenshots/**
            cypress/reports/**
            reports/**
